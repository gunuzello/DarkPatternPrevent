server:
  port: ${PORT:8080}
spring:
  application:
    name: baromi-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/baromi}
    username: ${DATABASE_USERNAME:baromi}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
baromi:
  worker-token: ${BAROMI_WORKER_TOKEN:}
  web-origins: ${BAROMI_WEB_ORIGINS:}

