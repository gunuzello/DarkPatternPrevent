name: Spring backend

on:
  push:
    paths:
      - "backend-spring/**"
      - ".github/workflows/spring-backend.yml"
  pull_request:
    paths:
      - "backend-spring/**"
      - ".github/workflows/spring-backend.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-spring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
      - run: gradle test bootJar
      - name: Build runtime image
        run: docker build -t baromi-backend:ci .
